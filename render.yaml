services:
  - type: web
    name: anwer-telegram-app
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install --prefer-binary -r requirements.txt
    startCommand: gunicorn --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 1 --bind 0.0.0.0:$PORT --timeout 120 app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PORT
        value: "10000"
      - key: RENDER
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
