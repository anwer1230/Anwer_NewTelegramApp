<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الملف الشخصي — مركز سرعة إنجاز</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; }
        body { background: #0f0f1a; color: #e8e8e8; min-height: 100vh; overflow-x: hidden; }

        /* ═══ شريط العنوان ═══ */
        .top-bar {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; gap: 10px;
            padding: 12px 16px;
            background: rgba(15,15,26,.97);
            border-bottom: 1px solid rgba(255,255,255,.06);
            backdrop-filter: blur(12px);
        }
        .back-btn {
            background: none; border: none; color: #e8e8e8;
            font-size: 20px; cursor: pointer; padding: 4px 8px;
            border-radius: 8px; transition: background .2s;
        }
        .back-btn:hover { background: rgba(255,255,255,.07); }
        .top-bar h1 { font-size: 18px; font-weight: 700; color: #fff; }

        /* ═══ غطاء الملف الشخصي ═══ */
        .profile-cover {
            background: linear-gradient(135deg, #0088cc 0%, #004c8a 100%);
            height: 140px; position: relative;
        }

        /* ═══ بطاقة الأفاتار ═══ */
        .avatar-section {
            display: flex; flex-direction: column; align-items: center;
            margin-top: -56px; padding: 0 20px 24px;
        }
        .avatar-wrap {
            position: relative; width: 112px; height: 112px; cursor: pointer;
        }
        .avatar-wrap .avatar {
            width: 112px; height: 112px; border-radius: 50%;
            background: linear-gradient(135deg, #0088cc, #005f8c);
            display: flex; align-items: center; justify-content: center;
            font-size: 44px; font-weight: 800; color: #fff;
            border: 4px solid #0f0f1a;
            object-fit: cover; overflow: hidden;
        }
        .avatar-wrap .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .avatar-wrap .edit-overlay {
            position: absolute; inset: 0; border-radius: 50%;
            background: rgba(0,0,0,.45);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity .2s;
        }
        .avatar-wrap:hover .edit-overlay,
        .avatar-wrap:active .edit-overlay { opacity: 1; }
        .avatar-wrap .edit-overlay i { color: #fff; font-size: 22px; }
        #photoInput { display: none; }

        .profile-name {
            margin-top: 14px; font-size: 24px; font-weight: 800; color: #fff;
            text-align: center; line-height: 1.2;
        }
        .profile-phone {
            margin-top: 4px; font-size: 14px; color: rgba(255,255,255,.55);
            text-align: center;
        }
        .profile-username {
            margin-top: 2px; font-size: 13px; color: #0088cc;
            text-align: center;
        }

        /* ═══ البطاقات ═══ */
        .card-section {
            margin: 12px 16px;
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.06);
            border-radius: 16px; overflow: hidden;
        }
        .card-row {
            display: flex; align-items: center; gap: 14px;
            padding: 16px 18px;
            border-bottom: 1px solid rgba(255,255,255,.04);
            cursor: pointer; transition: background .18s;
        }
        .card-row:last-child { border-bottom: none; }
        .card-row:hover { background: rgba(255,255,255,.04); }
        .card-row .row-icon {
            width: 38px; height: 38px; border-radius: 50%;
            background: rgba(0,136,204,.18);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; font-size: 17px; color: #0088cc;
        }
        .card-row .row-body { flex: 1; min-width: 0; }
        .card-row .row-label { font-size: 12px; color: rgba(255,255,255,.4); margin-bottom: 2px; }
        .card-row .row-val { font-size: 15px; color: #e8e8e8; font-weight: 500; }
        .card-row .row-action { color: rgba(255,255,255,.3); font-size: 14px; }

        /* ═══ مودال التعديل ═══ */
        .modal-overlay {
            display: none; position: fixed; inset: 0; z-index: 200;
            background: rgba(0,0,0,.7); align-items: center; justify-content: center;
            padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: #1c1c2e;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 20px; width: 100%; max-width: 400px;
            padding: 28px 24px; animation: slideUp .22s ease;
        }
        @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:none} }
        .modal-box h3 { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 20px; }
        .modal-box .field { margin-bottom: 16px; }
        .modal-box label { font-size: 13px; color: rgba(255,255,255,.5); margin-bottom: 6px; display: block; }
        .modal-box input {
            width: 100%; background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 10px; padding: 10px 14px;
            color: #fff; font-size: 15px; font-family: Tajawal, sans-serif;
            outline: none; transition: border .2s;
        }
        .modal-box input:focus { border-color: #0088cc; }
        .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
        .btn-cancel {
            flex: 1; padding: 11px; border-radius: 10px;
            background: rgba(255,255,255,.06); border: none;
            color: #e8e8e8; font-size: 15px; cursor: pointer;
            font-family: Tajawal, sans-serif; font-weight: 600;
            transition: background .2s;
        }
        .btn-cancel:hover { background: rgba(255,255,255,.1); }
        .btn-save {
            flex: 1; padding: 11px; border-radius: 10px;
            background: #0088cc; border: none;
            color: #fff; font-size: 15px; cursor: pointer;
            font-family: Tajawal, sans-serif; font-weight: 700;
            transition: background .2s;
        }
        .btn-save:hover { background: #006fa3; }
        .btn-save:disabled { opacity: .55; cursor: default; }

        /* ═══ Toast ═══ */
        .toast-wrap {
            position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
            z-index: 500; display: flex; flex-direction: column; gap: 8px; align-items: center;
            pointer-events: none;
        }
        .toast {
            background: rgba(30,30,50,.96); border: 1px solid rgba(255,255,255,.1);
            color: #fff; padding: 10px 20px; border-radius: 24px;
            font-size: 14px; backdrop-filter: blur(8px);
            animation: toastIn .25s ease;
        }
        @keyframes toastIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }

        /* ═══ Loader ═══ */
        .loader {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 14px;
            padding: 60px 20px; color: rgba(255,255,255,.4);
        }
        .spin { animation: spin .8s linear infinite; font-size: 32px; color: #0088cc; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ═══ شريط التحميل للصورة ═══ */
        .photo-progress {
            display: none; margin: 12px 16px 0;
            height: 4px; background: rgba(255,255,255,.07); border-radius: 4px; overflow: hidden;
        }
        .photo-progress.active { display: block; }
        .photo-progress .bar {
            height: 100%; width: 0; background: #0088cc;
            border-radius: 4px; transition: width .3s;
        }
    </style>
</head>
<body>

<!-- شريط العنوان -->
<div class="top-bar">
    <button class="back-btn" onclick="history.back()"><i class="fas fa-arrow-right"></i></button>
    <h1>الملف الشخصي</h1>
</div>

<!-- غلاف -->
<div class="profile-cover"></div>

<!-- محتوى -->
<div id="mainContent">
    <div class="loader">
        <i class="fas fa-spinner spin"></i>
        <p>جاري التحميل...</p>
    </div>
</div>

<!-- مودال تعديل الاسم -->
<div class="modal-overlay" id="nameModal">
    <div class="modal-box">
        <h3><i class="fas fa-user-edit" style="color:#0088cc;margin-left:8px"></i> تعديل الاسم</h3>
        <div class="field">
            <label>الاسم الأول <span style="color:#f66">*</span></label>
            <input type="text" id="inputFirst" placeholder="الاسم الأول" maxlength="64">
        </div>
        <div class="field">
            <label>اسم العائلة</label>
            <input type="text" id="inputLast" placeholder="اسم العائلة (اختياري)" maxlength="64">
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
            <button class="btn-save" id="saveName" onclick="saveName()">حفظ</button>
        </div>
    </div>
</div>

<!-- مودال لتأكيد تغيير الصورة -->
<div class="toast-wrap" id="toastWrap"></div>

<!-- input الصورة المخفي -->
<input type="file" id="photoInput" accept="image/*" onchange="uploadPhoto(this)">

<!-- شريط تقدم الصورة -->
<div class="photo-progress" id="photoProgress">
    <div class="bar" id="photoBar"></div>
</div>

<script>
const CURRENT_USER_ID = "{{ user_id }}";
let userData = {};

// ════════════════════════════════════════
//  تحميل البيانات
// ════════════════════════════════════════
async function loadProfile() {
    try {
        const res  = await fetch('/api/me');
        const data = await res.json();
        if (!data.success) throw new Error(data.message || 'فشل');
        userData = data.user;
        renderProfile(userData);
    } catch (e) {
        document.getElementById('mainContent').innerHTML =
            `<div class="loader"><i class="fas fa-exclamation-triangle" style="color:#f66;font-size:32px"></i><p>${e.message}</p></div>`;
    }
}

// ════════════════════════════════════════
//  رسم الصفحة
// ════════════════════════════════════════
function renderProfile(u) {
    const initial = (u.first_name || u.name || 'م').charAt(0).toUpperCase();
    const fullName = u.name || `${u.first_name} ${u.last_name}`.trim() || 'مستخدم';

    document.getElementById('mainContent').innerHTML = `
        <!-- أفاتار -->
        <div class="avatar-section">
            <div class="avatar-wrap" onclick="document.getElementById('photoInput').click()" title="تغيير الصورة">
                <div class="avatar" id="avatarEl">
                    <span id="avatarInitial">${initial}</span>
                </div>
                <div class="edit-overlay"><i class="fas fa-camera"></i></div>
            </div>
            <div class="profile-name" id="profileName">${escHtml(fullName)}</div>
            ${u.username ? `<div class="profile-username">@${escHtml(u.username)}</div>` : ''}
            ${u.phone    ? `<div class="profile-phone"><i class="fas fa-phone" style="font-size:11px;margin-left:4px"></i>${escHtml(u.phone)}</div>` : ''}
        </div>

        <!-- بطاقة المعلومات -->
        <div class="card-section">
            <div class="card-row" onclick="openNameModal()">
                <div class="row-icon"><i class="fas fa-user"></i></div>
                <div class="row-body">
                    <div class="row-label">الاسم الكامل</div>
                    <div class="row-val" id="nameVal">${escHtml(fullName)}</div>
                </div>
                <div class="row-action"><i class="fas fa-pen"></i></div>
            </div>
            ${u.username ? `
            <div class="card-row">
                <div class="row-icon"><i class="fas fa-at"></i></div>
                <div class="row-body">
                    <div class="row-label">اسم المستخدم</div>
                    <div class="row-val">@${escHtml(u.username)}</div>
                </div>
            </div>` : ''}
            ${u.phone ? `
            <div class="card-row">
                <div class="row-icon"><i class="fas fa-phone"></i></div>
                <div class="row-body">
                    <div class="row-label">رقم الهاتف</div>
                    <div class="row-val">${escHtml(u.phone)}</div>
                </div>
            </div>` : ''}
        </div>

        <!-- أزرار إضافية -->
        <div class="card-section">
            <div class="card-row" onclick="document.getElementById('photoInput').click()">
                <div class="row-icon"><i class="fas fa-camera"></i></div>
                <div class="row-body">
                    <div class="row-label">الصورة الشخصية</div>
                    <div class="row-val">تغيير صورة الملف الشخصي</div>
                </div>
                <div class="row-action"><i class="fas fa-chevron-left"></i></div>
            </div>
            <div class="card-row" onclick="openNameModal()">
                <div class="row-icon"><i class="fas fa-pen-to-square"></i></div>
                <div class="row-body">
                    <div class="row-label">تعديل الاسم</div>
                    <div class="row-val">تغيير الاسم الأول واسم العائلة</div>
                </div>
                <div class="row-action"><i class="fas fa-chevron-left"></i></div>
            </div>
        </div>
    `;
}

// ════════════════════════════════════════
//  مودال الاسم
// ════════════════════════════════════════
function openNameModal() {
    document.getElementById('inputFirst').value = userData.first_name || '';
    document.getElementById('inputLast').value  = userData.last_name  || '';
    document.getElementById('nameModal').classList.add('open');
    document.getElementById('inputFirst').focus();
}
function closeModal() {
    document.getElementById('nameModal').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

async function saveName() {
    const first = document.getElementById('inputFirst').value.trim();
    const last  = document.getElementById('inputLast').value.trim();
    if (!first) { showToast('الاسم الأول مطلوب', 'error'); return; }

    const btn = document.getElementById('saveName');
    btn.disabled = true; btn.textContent = 'جاري الحفظ...';

    try {
        const res  = await fetch('/api/me/name', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ first_name: first, last_name: last }),
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.message);

        userData.first_name = first;
        userData.last_name  = last;
        userData.name = `${first} ${last}`.trim();

        // تحديث العناصر في الصفحة
        const fullName = userData.name;
        document.getElementById('profileName').textContent = fullName;
        const nameVal = document.getElementById('nameVal');
        if (nameVal) nameVal.textContent = fullName;
        const ini = document.getElementById('avatarInitial');
        if (ini) ini.textContent = first.charAt(0).toUpperCase();

        closeModal();
        showToast('✅ تم تحديث الاسم بنجاح');
    } catch (e) {
        showToast('❌ ' + e.message, 'error');
    } finally {
        btn.disabled = false; btn.textContent = 'حفظ';
    }
}

// ════════════════════════════════════════
//  رفع الصورة
// ════════════════════════════════════════
async function uploadPhoto(input) {
    const file = input.files[0];
    if (!file) return;
    if (file.size > 10 * 1024 * 1024) { showToast('❌ الحجم الأقصى 10MB', 'error'); return; }

    const progress = document.getElementById('photoProgress');
    const bar      = document.getElementById('photoBar');
    progress.classList.add('active');
    bar.style.width = '20%';

    try {
        const fd = new FormData();
        fd.append('photo', file);
        bar.style.width = '50%';

        const res  = await fetch('/api/me/photo', { method: 'POST', body: fd });
        bar.style.width = '85%';
        const data = await res.json();
        if (!data.success) throw new Error(data.message);

        bar.style.width = '100%';

        // معاينة الصورة محلياً فوراً
        const reader = new FileReader();
        reader.onload = e => {
            const avatarEl = document.getElementById('avatarEl');
            if (avatarEl) {
                avatarEl.innerHTML = `<img src="${e.target.result}" alt="صورة">`;
            }
        };
        reader.readAsDataURL(file);

        showToast('✅ تم تحديث الصورة الشخصية');
    } catch (e) {
        showToast('❌ ' + e.message, 'error');
    } finally {
        setTimeout(() => {
            progress.classList.remove('active');
            bar.style.width = '0';
        }, 800);
        input.value = '';
    }
}

// ════════════════════════════════════════
//  مساعدات
// ════════════════════════════════════════
function escHtml(s) {
    return String(s || '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, type) {
    const wrap = document.getElementById('toastWrap');
    const t = document.createElement('div');
    t.className = 'toast';
    if (type === 'error') t.style.borderColor = 'rgba(255,80,80,.4)';
    t.textContent = msg;
    wrap.appendChild(t);
    setTimeout(() => t.remove(), 3200);
}

// ════════════════════════════════════════
//  تشغيل
// ════════════════════════════════════════
loadProfile();
</script>
</body>
</html>
