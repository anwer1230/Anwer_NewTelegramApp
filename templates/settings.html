<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإعدادات — مركز سرعة إنجاز</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="/static/css/style.css"    rel="stylesheet">
    <link href="/static/css/themes.css"   rel="stylesheet">
    <link href="/static/css/settings.css" rel="stylesheet">
    <style>
        body { background: #0f0f1a; color: #e0e0e0; font-family: Tajawal, sans-serif; }
        .page-header {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 16px;
            background: rgba(255,255,255,0.02);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: sticky; top: 0; z-index: 10;
            backdrop-filter: blur(8px);
        }
        .page-header .back-btn {
            background: none; border: none; color: #e0e0e0;
            font-size: 18px; cursor: pointer; padding: 4px 8px;
            border-radius: 8px; transition: background .2s;
        }
        .page-header .back-btn:hover { background: rgba(255,255,255,0.06); }
        .page-header h5 { margin: 0; font-size: 16px; font-weight: 600; }
        .storage-bar {
            height: 6px; border-radius: 3px;
            background: rgba(255,255,255,0.06);
            margin-top: 8px; overflow: hidden;
        }
        #storageProgress {
            height: 100%;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            border-radius: 3px;
            transition: width .4s;
        }
        .nav-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            text-decoration: none;
            color: var(--text-primary, #e0e0e0);
            transition: background .15s;
            border-radius: 6px;
        }
        .nav-row:hover { background: rgba(255,255,255,0.03); padding-right: 6px; }
        .nav-row i.arrow { color: #444; }
    </style>
</head>
<body>

<div class="page-header">
    <button class="back-btn" onclick="history.back()">
        <i class="fas fa-arrow-right"></i>
    </button>
    <h5><i class="fas fa-cog" style="color:#00d2ff;"></i> الإعدادات</h5>
</div>

<div class="settings-container">

    <!-- ── المظهر ── -->
    <div class="settings-card">
        <div class="card-title"><i class="fas fa-palette"></i> المظهر</div>
        <div class="d-flex gap-2 flex-wrap">
            <button class="theme-btn" data-theme="dark"  onclick="setTheme('dark')">
                <i class="fas fa-moon"></i> ليلي
            </button>
            <button class="theme-btn" data-theme="light" onclick="setTheme('light')">
                <i class="fas fa-sun"></i> نهاري
            </button>
            <button class="theme-btn" data-theme="auto"  onclick="setTheme('auto')">
                <i class="fas fa-clock"></i> تلقائي
            </button>
        </div>
    </div>

    <!-- ── الإشعارات ── -->
    <div class="settings-card">
        <div class="card-title"><i class="fas fa-bell"></i> الإشعارات</div>
        <div class="setting-row">
            <span><i class="fas fa-bell" style="color:#00d2ff;width:18px;"></i> إشعارات التطبيق</span>
            <label class="switch">
                <input type="checkbox" checked onchange="toggleNotifications(this.checked)">
                <span class="slider"></span>
            </label>
        </div>
        <div class="setting-row">
            <span><i class="fas fa-volume-up" style="color:#2ecc71;width:18px;"></i> الأصوات</span>
            <label class="switch">
                <input type="checkbox" checked onchange="toggleSound(this.checked)">
                <span class="slider"></span>
            </label>
        </div>
        <div class="setting-row">
            <span><i class="fas fa-mobile-alt" style="color:#f9ca24;width:18px;"></i> الاهتزاز</span>
            <label class="switch">
                <input type="checkbox" checked onchange="toggleVibration(this.checked)">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- ── الخصوصية ── -->
    <div class="settings-card">
        <div class="card-title"><i class="fas fa-user-shield"></i> الخصوصية</div>
        <div class="setting-row">
            <span><i class="fas fa-clock" style="color:#888;width:18px;"></i> آخر ظهور</span>
            <select class="privacy-select form-select form-select-sm" data-key="last_seen"
                    style="width:130px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);color:#e0e0e0;border-radius:8px;">
                <option value="everyone">الجميع</option>
                <option value="contacts">جهات الاتصال</option>
                <option value="nobody">لا أحد</option>
            </select>
        </div>
        <div class="setting-row">
            <span><i class="fas fa-image" style="color:#888;width:18px;"></i> الصورة الشخصية</span>
            <select class="privacy-select form-select form-select-sm" data-key="profile_photo"
                    style="width:130px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);color:#e0e0e0;border-radius:8px;">
                <option value="everyone">الجميع</option>
                <option value="contacts">جهات الاتصال</option>
                <option value="nobody">لا أحد</option>
            </select>
        </div>
        <div class="setting-row">
            <span><i class="fas fa-phone" style="color:#888;width:18px;"></i> رقم الهاتف</span>
            <select class="privacy-select form-select form-select-sm" data-key="phone_number"
                    style="width:130px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);color:#e0e0e0;border-radius:8px;">
                <option value="contacts">جهات الاتصال</option>
                <option value="nobody">لا أحد</option>
            </select>
        </div>
    </div>

    <!-- ── روابط سريعة ── -->
    <div class="settings-card">
        <div class="card-title"><i class="fas fa-link"></i> روابط سريعة</div>
        <a href="/security_settings" class="nav-row">
            <span><i class="fas fa-shield-alt" style="color:#00d2ff;width:18px;"></i> الأمان والجلسات النشطة</span>
            <i class="fas fa-chevron-left arrow"></i>
        </a>
        <div class="nav-row" onclick="history.back()">
            <span><i class="fas fa-comments" style="color:#2ecc71;width:18px;"></i> العودة للمحادثات</span>
            <i class="fas fa-chevron-left arrow"></i>
        </div>
    </div>

    <!-- ── التخزين ── -->
    <div class="settings-card">
        <div class="card-title"><i class="fas fa-database"></i> التخزين</div>
        <div class="d-flex justify-content-between" style="font-size:13px;color:#888;">
            <span>المستخدم</span>
            <span id="storageUsed">جارٍ الحساب...</span>
        </div>
        <div class="storage-bar">
            <div id="storageProgress" style="width:0%;"></div>
        </div>
        <button class="btn btn-outline-secondary btn-sm mt-3" onclick="clearCache()">
            <i class="fas fa-broom"></i> تنظيف الذاكرة المؤقتة
        </button>
    </div>

    <!-- ── معلومات ── -->
    <div class="settings-card text-center" style="color:#555;font-size:13px;">
        <div style="font-size:24px;margin-bottom:8px;">📚</div>
        <div style="font-weight:600;color:#888;">مركز سرعة إنجاز</div>
        <div>الإصدار 2.0.0</div>
        <div style="margin-top:6px;">© 2026 جميع الحقوق محفوظة</div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/settings.js"></script>
</body>
</html>
